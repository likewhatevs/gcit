[book]
authors = ["gcit contributors"]
language = "en"
src = "src"
title = "gcit operator manual"
description = "Operator-focused documentation for gcit (GitHub CI triggers): poll git repos, dispatch GitHub Actions workflows, post Discord/mail notifications."

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/likewhatevs/gcit"
edit-url-template = "https://github.com/likewhatevs/gcit/edit/main/book/{path}"

[output.linkcheck2]
warning-policy = "error"
