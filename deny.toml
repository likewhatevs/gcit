# cargo-deny configuration.
#
# Rules covered:
#   - advisories: RustSec advisory database; deny vulnerable crates
#   - bans: explicit deny-list (currently empty) + multiple-versions
#     policy. multiple-versions = "deny" so a duplicate major version
#     surfaces as a hard error rather than silently inflating the dep
#     tree.
#   - sources: only crates.io; no git/path overrides.
#   - licenses: GPL-2.0-only-compatible deps only.
#
# This file is read by the `audit` CI job. cargo-deny supports rule-
# specific overrides via `[rule.*]` tables; we keep the defaults strict
# and add narrow exemptions inline as the dep tree evolves.

[advisories]
# `db-path` is intentionally omitted: cargo-deny does NOT shell-expand
# `~`, so a literal `"~/.cargo/advisory-db"` would resolve to a
# directory named `~` under cwd. Falling back to cargo-deny's default
# (under the user's CARGO_HOME) is the correct behaviour.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # rsa 0.9.x Marvin timing attack (RUSTSEC-2023-0071). No fixed
    # version exists; pulled in transitively via octocrab → jsonwebtoken.
    # gcit never performs RSA decryption — octocrab uses jsonwebtoken
    # only for GitHub App JWT signing (RS256), which is not vulnerable
    # to the Marvin attack (chosen-ciphertext on PKCS#1 v1.5 decrypt).
    "RUSTSEC-2023-0071",
    # gix-date 0.9.4 non-utf8 TimeBuf::as_str (RUSTSEC-2025-0140).
    # Build-time only via vergen-gix → gix 0.71; gcit never calls
    # TimeBuf::as_str. No newer gix available in vergen-gix stable.
    "RUSTSEC-2025-0140",
]

[bans]
# Duplicate major versions are a merge gate.
multiple-versions = "deny"
wildcards = "deny"
allow = []
deny = []
# Transitive dep version splits that gcit cannot resolve: different
# major consumers (octocrab, gix-transport, zbus, etc.) depend on
# incompatible versions of these foundational crates.
skip = [
    { crate = "foldhash" },
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "linux-raw-sys" },
    { crate = "r-efi" },
    { crate = "redox_syscall" },
    { crate = "reqwest" },
    { crate = "rustix" },
    { crate = "toml_datetime" },
    { crate = "windows-sys" },
    { crate = "winnow" },
    { crate = "wit-bindgen" },
]
# vergen-gix 1.x depends on gix 0.71 which pulls in older versions of
# every gix-* crate alongside our direct (latest) gix-* deps. These
# duplicates are build-time only and cannot be eliminated until
# vergen-gix releases a version against a newer gix.
skip-tree = [{ crate = "vergen-gix@1", depth = 20 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Cargo.toml declares license = "GPL-2.0-only" so dep licenses must be
# GPL-2.0 compatible. The list below accepts every commonly-permissive
# license that the FSF rates compatible with GPL-2.0 plus GPL-2.0
# itself.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "GPL-2.0",
    "GPL-2.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []
