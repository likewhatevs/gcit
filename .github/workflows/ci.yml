# gcit CI: per-PR merge-gate workflow.
#
# All commands live in the justfile so they are runnable locally via
# `just ci-*`. The YAML handles only checkout, toolchain, cache, and
# tool installation; every `run:` step calls a justfile recipe.
#
# Job matrix:
#   test       — fmt + clippy + nextest + llvm-cov 90% gate
#   musl       — release build to x86_64-unknown-linux-musl
#   audit      — cargo audit + cargo deny check
#   docs       — mdbook build + test + linkcheck
#   sd-analyze — systemd-analyze security (target SAFE, score < 1.0)
#   mutants    — cargo mutants per-PR (--in-diff origin/main)

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt + clippy + nextest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@just
      - name: just ci-fmt
        run: just ci-fmt
      - name: just ci-clippy
        run: just ci-clippy
      - name: just ci-coverage
        run: just ci-coverage
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  musl:
    name: release build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: just ci-musl
        run: just ci-musl

  audit:
    name: cargo audit + cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@just
      - name: just ci-audit
        run: just ci-audit

  docs:
    name: mdbook build + test + linkcheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@mdbook
      - uses: taiki-e/install-action@just
      - name: Install mdbook-linkcheck2
        run: cargo install mdbook-linkcheck2 --locked
      - name: just ci-docs
        run: just ci-docs
      - name: Deploy mdbook to gh-pages
        if: github.ref == 'refs/heads/main' && hashFiles('book/src/SUMMARY.md') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./book/book/html
          destination_dir: book
          keep_files: true
          commit_message: "ci: refresh mdbook"

  sd-analyze:
    name: systemd-analyze security score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: Install systemd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends systemd
      - name: just ci-sd-analyze
        run: just ci-sd-analyze

  mutants-pr:
    name: cargo mutants (--in-diff origin/main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-mutants
      - uses: taiki-e/install-action@just
      - name: just ci-mutants
        run: just ci-mutants
      - name: Upload cargo-mutants output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-mutants-output
          path: mutants.out
          if-no-files-found: warn
          retention-days: 14
      - name: just ci-mutants-gate
        if: always()
        run: just ci-mutants-gate
