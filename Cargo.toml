[package]
name = "gcit"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-2.0-only"
description = "Poll git repos, dispatch GitHub Actions workflows, post Discord notifications. Linux + systemd."
repository = "https://github.com/likewhatevs/gcit"
keywords = ["systemd", "github-actions", "discord", "ci"]
categories = ["command-line-utilities", "os::linux-apis"]

[lib]
name = "gcit"
path = "src/lib.rs"

[[bin]]
name = "gcit"
path = "src/bin/gcit.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
# futures-util: SinkExt::send and StreamExt::next combinators on the
# tokio_util Framed<UnixStream, LengthDelimitedCodec> in src/control.
# Already in the dep tree transitively (gix-protocol), but we declare it
# directly because we use it as a first-class API. Default features
# (std + async-await) don't enable Sink/Stream traits; sink alone pulls
# in futures-core/futures-sink, which transitively gives us Stream and
# StreamExt for the codec read side.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "stream"] }

gix-url = "0.36"
gix-transport = { version = "0.57", default-features = false, features = ["blocking-client", "http-client-reqwest", "http-client-reqwest-rust-tls"] }
gix-protocol = { version = "0.61", default-features = false, features = ["blocking-client", "handshake"] }
gix-features = "0.48"
gix-credentials = "0.38"
gix-hash = { version = "0.25", features = ["sha1"] }
gix-refspec = "0.41"

octocrab = "0.49"

twilight-http = { version = "0.17", default-features = false, features = ["rustls-native-roots", "decompression"] }
twilight-model = "0.17"
twilight-validate = "0.17"

rustls = { version = "0.23", default-features = false, features = ["ring"] }

sd-notify = "0.5"
zbus = { version = "5", default-features = false, features = ["tokio"] }

clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# clap_complete: emits shell completion scripts for `gcit completions
# <SHELL>`. Default features are empty (verified at
# clap_complete-4.6.2/Cargo.toml); we only need the `aot` API
# (`generate` + `Shell`) which is always available.
clap_complete = { version = "4.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", features = ["preserve_order"] }
humantime-serde = "1"
humantime = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-journald = "0.3"

thiserror = "2"
anyhow = "1"

handlebars = "6.4"

secrecy = { version = "0.10", features = ["serde"] }

fd-lock = "4.0"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
fastrand = { version = "2", default-features = false, features = ["std"] }
tempfile = "3"

url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
# sha2: install-manifest entry hashing (sha256 hash + mode + path).
sha2 = "0.10"
# libc: SO_PEERCRED uid/gid checks for control socket peer authentication.
# geteuid() called from cli/check.rs and control/server.rs.
libc = "0.2"
# flate2: gunzip the static manifest.js.gz file kernel.org publishes for
# the grokmirror polling strategy. The file is .gz on disk (NOT served
# with Content-Encoding: gzip), so reqwest's transparent decompression
# does not apply; we must decode the body explicitly.
flate2 = "1"
# bstr: declare a direct dep so src/git/ls_remote.rs can call
# ByteSlice::as_bstr() on BString fields gix_protocol::handshake::Ref
# exposes. bstr is already in the dep graph transitively via gix-*;
# this declaration only makes it reachable from gcit's first-party
# code without going through a re-export chain that does not exist.
bstr = "1"
# http: octocrab returns http::StatusCode in its Error::GitHub variant
# (octocrab/src/error.rs:117). We classify by status code in
# src/git/github_api.rs and need direct access to the type.
# Already in the graph via octocrab/reqwest; this declaration just
# makes the type reachable from first-party code.
http = "1"
# http-body, http-body-util: wrap octocrab response bodies in
# Limited<B> for a 16 MiB cap on GitHub API responses (gzip-bomb
# defense). Both are already in the graph via octocrab/hyper-util;
# this declaration makes the types reachable from first-party
# code without going through a re-export chain that does not exist.
http-body = "1"
http-body-util = "0.1"

[build-dependencies]
vergen-gix = { version = "1", features = ["build"] }
anyhow = "1"

[features]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
proptest = "1"
serial_test = "3"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rstest = "0.24"
# tracing-test: capture and assert tracing events produced during a
# test. The `no-env-filter` feature is required for integration tests
# under `tests/` because cargo treats each `tests/<name>.rs` as its
# own crate; tracing-test's default per-crate filter would scope the
# capture to the test crate itself, hiding events emitted by `gcit`
# (the lib under test). `no-env-filter` widens the filter to "trace"
# across all crates.
tracing-test = { version = "0.2", features = ["no-env-filter"] }

[profile.mutants]
inherits = "test"
debug = "none"
