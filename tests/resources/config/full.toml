# Golden valid config. Every documented field populated.
#
# This fixture is the canonical "full" example: every value the operator
# can configure is present so a snapshot test catches incidental
# field-rename drift across schema amendments.

# Top-level poll defaults. These apply to every flow that does not
# override them via `[flow.poll]`. source_interval is set to 60s
# explicitly so the snapshot exercises every documented field; in a
# minimal config the value is omitted and gcit falls back to the
# per-strategy default (60s for github.com / kernel.org, 5m for
# `LsRemote`).
[poll]
source_interval = "60s"
job_interval    = "30s"
jitter          = 0.1

# Tracing filter (env-filter syntax). Optional — gcit's daemon main()
# falls back to RUST_LOG / a sane default when absent.
[log]
filter = "info,gcit=debug"

# HTTP client tuning shared across octocrab / twilight / direct reqwest.
[http]
request_timeout = "30s"

# Each [[flow]] maps a polled git source to a dispatched GitHub Actions
# workflow plus zero or more notification destinations. A config can
# carry many flows; gcit supervises each independently.
[[flow]]
name        = "linux-mainline-ci"
enabled     = true
description = "Watch torvalds/linux master and dispatch our CI builder."

[flow.source]
url = "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
ref = "refs/heads/master"

# action.kind is a tagged-enum discriminator. v1 supports
# `github_workflow_dispatch`; new kinds require a code change.
# credential_id maps to GCIT_CREDENTIAL_GITHUB_PAT (or to
# a `LoadCredential=github_pat:...` slot under systemd) — uppercase +
# s/-/_/ + GCIT_CREDENTIAL_ prefix.
[flow.action]
kind          = "github_workflow_dispatch"
repo          = "myorg/linux-builder"
workflow      = "ci.yml"
ref           = "refs/heads/main"
credential_id = "github_pat"
inputs        = { upstream_sha = "{{source.sha}}" }

# A flow may have multiple destinations. Each is independently rate-
# limited and never blocks the others. fire_on selects which lifecycle
# events trigger this destination; an empty array silently disables it.
[[flow.destination]]
kind          = "discord_webhook"
credential_id = "discord_ci_webhook"
fire_on       = ["run_complete"]

[flow.destination.template]
title       = "{{flow.name}}: {{run.conclusion}}"
description = "linux@{{source.sha_short}} -> {{action.repo}}/{{action.workflow}}"

# local_mail appends an mbox-formatted message to /var/mail/<user>; no
# SMTP, no MTA. The unit's `BindPaths=/var/mail` makes the spool
# visible inside the RootDirectory chroot.
[[flow.destination]]
kind    = "local_mail"
user    = "ops"
fire_on = ["run_complete"]
