# credential_ids "foo-bar" and "foo_bar" both map to
# GCIT_CREDENTIAL_FOO_BAR. gcit must detect this collision at config load
# and refuse to start, naming both ids.

[[flow]]
name = "a"

[flow.source]
url = "https://git.kernel.org/x.git"
ref = "refs/heads/master"

[flow.action]
kind          = "github_workflow_dispatch"
repo          = "o/r"
workflow      = "ci.yml"
ref           = "refs/heads/main"
credential_id = "foo-bar"

[[flow]]
name = "b"

[flow.source]
url = "https://git.kernel.org/y.git"
ref = "refs/heads/master"

[flow.action]
kind          = "github_workflow_dispatch"
repo          = "o/s"
workflow      = "ci.yml"
ref           = "refs/heads/main"
credential_id = "foo_bar"
